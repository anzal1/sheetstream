name: CI

# Builds prebuilt binaries for the six supported targets and tests them on the
# runners that can execute them. On main, once everything passes, it publishes
# to npm if the version in package.json is not on npm yet, so releasing is just
# bumping the version. Publishing uses npm trusted publishing (OIDC), so there
# is no token in the repo.

env:
  DEBUG: napi:*
  APP_NAME: sheetstream
  MACOSX_DEPLOYMENT_TARGET: '11.0'

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main, it may be mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-latest
            build: npx napi build --platform --release --target aarch64-apple-darwin --js binding.js --dts binding.d.ts
          - target: x86_64-apple-darwin
            host: macos-latest
            build: npx napi build --platform --release --target x86_64-apple-darwin --js binding.js --dts binding.d.ts
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
            build: npx napi build --platform --release --target x86_64-unknown-linux-gnu --use-napi-cross --js binding.js --dts binding.d.ts
          - target: x86_64-unknown-linux-musl
            host: ubuntu-latest
            build: npx napi build --platform --release --target x86_64-unknown-linux-musl --cross-compile --js binding.js --dts binding.d.ts
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-latest
            build: npx napi build --platform --release --target aarch64-unknown-linux-gnu --use-napi-cross --js binding.js --dts binding.d.ts
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            build: npx napi build --platform --release --target x86_64-pc-windows-msvc --js binding.js --dts binding.d.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - uses: mlugg/setup-zig@v2
        if: ${{ matrix.settings.target == 'x86_64-unknown-linux-musl' }}
        with:
          version: 0.14.1
      - name: Install dependencies
        run: npm install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload binding
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            binding.js
            binding.d.ts
          if-no-files-found: error

  test:
    name: test ${{ matrix.settings.target }} node ${{ matrix.node }}
    needs: build
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: aarch64-apple-darwin
            host: macos-latest
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            host: windows-latest
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Download binding
        uses: actions/download-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: Test
        run: npm test
        shell: bash

  # Runs the musl build inside Alpine to confirm the binary loads there.
  test-linux-x64-musl:
    name: test x86_64-unknown-linux-musl
    needs: build
    runs-on: ubuntu-latest
    container: node:22-alpine
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: .
      - name: Test
        run: npm test

  # Native arm64 runner (free for public repos). Emulating arm64 under QEMU made
  # the timing and memory checks meaningless.
  test-linux-arm64-gnu:
    name: test aarch64-unknown-linux-gnu
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: .
      - run: npm ci
      - name: Test
        run: npm test

  publish:
    name: publish
    needs: [build, test, test-linux-x64-musl, test-linux-arm64-gnu]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Is this version already on npm?
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$NAME@$VER" version 2>/dev/null)" ]; then
            echo "$NAME@$VER is already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.publish == 'true'
        with:
          pattern: bindings-*
          path: artifacts
      - name: Collect the six binaries
        if: steps.check.outputs.publish == 'true'
        run: |
          cp artifacts/*/${APP_NAME}.*.node .
          ls -l ${APP_NAME}.*.node
          test "$(ls ${APP_NAME}.*.node | wc -l)" -eq 6
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          npm install -g npm@latest
          case "${{ steps.check.outputs.version }}" in
            *-*) npm publish --access public --tag next ;;
            *)   npm publish --access public ;;
          esac
      - name: GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.check.outputs.version }}"
          case "$V" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
          gh release create "$V" --target "$GITHUB_SHA" --generate-notes $PRE
