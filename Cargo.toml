[package]
name = "sheetstream"
version = "0.2.0"
edition = "2021"
description = "Streaming XLSX and CSV read/write for Node.js and Bun, written in Rust"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
calamine = "0.36"
csv = "1.4.0"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"
